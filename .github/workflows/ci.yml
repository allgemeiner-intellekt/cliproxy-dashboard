name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# One run per ref. PR runs replace each other; main runs queue, so image
# pushes and deploys happen in commit order.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: npm ci
      - run: npm run lint
      - run: npm run server:check
      - run: npm run build
      - run: bun test
      - name: Check migrations match the schema
        run: |
          npx drizzle-kit check
          npx drizzle-kit generate
          if [ -n "$(git status --porcelain -- server/drizzle)" ]; then
            git status --porcelain -- server/drizzle
            echo "::error::server/src/db/schema.ts changed without a migration. Run 'npm run db:generate' and commit server/drizzle/."
            exit 1
          fi
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high

  # PRs build the image without pushing; main pushes it once check passes.
  image:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long,prefix=
      - if: env.PUSH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: ${{ env.PUSH == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ env.PUSH == 'true' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_HOOK_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Deploy
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
          DEPLOY_HOOK_URL: ${{ vars.DEPLOY_HOOK_URL }}
        run: |
          body='{"app":"cliproxy-dashboard"}'
          ts=$(date +%s)
          sig=$(printf '%s' "$ts.$body" | openssl dgst -sha256 -hmac "$DEPLOY_SECRET" -hex | sed 's/.* //')
          job=$(curl -fsS -H "X-Deploy-Timestamp: $ts" -H "X-Deploy-Signature: $sig" -d "$body" "$DEPLOY_HOOK_URL" | jq -r .job)
          for _ in $(seq 60); do
            read -r state error < <(curl -fsS "$DEPLOY_HOOK_URL/jobs/$job" | jq -r '[.state, (.error // "")] | @tsv')
            case "$state" in
              SUCCESS) echo "deployed (job $job)"; exit 0 ;;
              FAILED|ABORTED) echo "deploy failed: $error"; exit 1 ;;
            esac
            sleep 5
          done
          echo "deploy timed out (job $job)"; exit 1
