name: ci
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
# PR runs replace each other. Main runs don't share a group; the release job
# queues instead, so no passing commit is dropped.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Check the Dockerfile uses the same Bun as CI
        run: grep -qx "ARG BUN_VERSION=$(cat .bun-version)" Dockerfile || { echo "::error::Dockerfile ARG BUN_VERSION must equal .bun-version ($(cat .bun-version))"; exit 1; }
      - run: npm ci
      - run: npm run lint
      - run: npm run server:check
      - run: npm run build
      - run: npm test
      - name: Check migrations match the schema
        run: |
          npx drizzle-kit check
          # Builds one database from the migrations and one from the schema
          # and compares them. Catches hand-edited migration SQL.
          bun scripts/check-migrations.ts
          # Also catches a stale snapshot. A change drizzle-kit can only
          # resolve interactively (e.g. a rename) prints an error and exits 0,
          # so require the explicit no-change message.
          out=$(npx drizzle-kit generate 2>&1 </dev/null) || { echo "$out"; exit 1; }
          echo "$out"
          if ! grep -q 'No schema changes' <<<"$out" || [ -n "$(git status --porcelain -- server/drizzle)" ]; then
            git status --porcelain -- server/drizzle
            echo "::error::server/src/db/schema.ts changed without a matching migration. Run 'npm run db:generate' and commit server/drizzle/."
            exit 1
          fi
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  # Builds the image without pushing (PRs and manual runs on other branches).
  image:
    needs: check
    if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Pushes the image from main, tagged only by commit SHA, once check passes.
  publish:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=sha,format=long,prefix=
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Points :main at the published digest and deploys it, one run at a time.
  # The lock covers both, so a newer run can't retag :main while the hook is
  # still pulling. Only the tip of main is promoted, so an older run or a
  # rerun can't roll :main back.
  release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    concurrency:
      group: release-main
      queue: max
    steps:
      - id: tip
        name: Check this commit is still the tip of main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/heads/main" --jq .sha)
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo latest=true >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main is now at $tip, not $GITHUB_SHA. Not promoting or deploying this commit."
            echo latest=false >> "$GITHUB_OUTPUT"
          fi
      - if: steps.tip.outputs.latest == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: steps.tip.outputs.latest == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the image as :main
        if: steps.tip.outputs.latest == 'true'
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: docker buildx imagetools create --tag "$IMAGE:main" "$IMAGE@$DIGEST"
      - name: Deploy
        if: steps.tip.outputs.latest == 'true' && vars.DEPLOY_HOOK_URL != ''
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
          DEPLOY_HOOK_URL: ${{ vars.DEPLOY_HOOK_URL }}
        run: |
          # Signs "<timestamp>.<payload>" and sends it as hook.ts expects.
          signed() {
            local payload=$1; shift
            local ts sig
            ts=$(date +%s)
            sig=$(printf '%s' "$ts.$payload" | openssl dgst -sha256 -hmac "$DEPLOY_SECRET" -hex | sed 's/.* //')
            curl -fsS -H "X-Deploy-Timestamp: $ts" -H "X-Deploy-Signature: $sig" "$@"
          }
          body='{"app":"cliproxy-dashboard"}'
          job=$(signed "$body" -H 'Content-Type: application/json' -d "$body" "$DEPLOY_HOOK_URL" | jq -r .job)
          for _ in $(seq 60); do
            read -r state error < <(signed "job $job" "$DEPLOY_HOOK_URL/jobs/$job" | jq -r '[.state, (.error // "")] | @tsv')
            case "$state" in
              SUCCESS) echo "deployed (job $job)"; exit 0 ;;
              FAILED|ABORTED) echo "deploy failed: $error"; exit 1 ;;
            esac
            sleep 5
          done
          echo "deploy timed out (job $job)"; exit 1

  # A vX.Y.Z tag on a commit main already published: tags that image as
  # :X.Y.Z (and :X.Y) and creates the GitHub release from CHANGELOG.md.
  version:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    # One at a time, so the X.Y check below sees every earlier release.
    concurrency:
      group: version-tags
      queue: max
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - id: version
        name: Check the tag matches package.json and CHANGELOG.md
        run: |
          version=$(jq -r .version package.json)
          # SemVer without +build metadata, which Docker tags can't carry.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::package.json version $version must be X.Y.Z or X.Y.Z-prerelease."
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version."
            exit 1
          fi
          # The "## [X.Y.Z]" section, matched literally, up to the next "## ".
          notes=$(awk -v h="## [$version]" '
            found && /^## / { exit }
            found { print }
            index($0, h) == 1 { found = 1 }
          ' CHANGELOG.md)
          if [ -z "$(tr -d '[:space:]' <<<"$notes")" ]; then
            echo "::error::CHANGELOG.md has no section for $version."
            exit 1
          fi
          printf '%s\n' "$notes" > "$RUNNER_TEMP/notes.md"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the published image with the version
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          digest_of() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' 2>/dev/null | jq -r .digest
          }
          digest=$(digest_of "$IMAGE:$GITHUB_SHA")
          if [ -z "$digest" ] || [ "$digest" = null ]; then
            echo "::error::No image for $GITHUB_SHA. Tag a commit that main has published."
            exit 1
          fi
          # A version tag never moves. A rerun with the same image is a no-op.
          existing=$(digest_of "$IMAGE:$VERSION")
          if [ -n "$existing" ] && [ "$existing" != null ] && [ "$existing" != "$digest" ]; then
            echo "::error::$IMAGE:$VERSION already points at $existing, not $digest."
            exit 1
          fi
          tags=(--tag "$IMAGE:$VERSION")
          # Stable releases move X.Y, but only if this is the newest X.Y.* release
          # (so rerunning an older tag can't roll it back).
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            minor=${VERSION%.*}
            newest=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$minor." --jq '.[].ref' \
              | sed 's|^refs/tags/v||' | grep -E "^${minor//./\\.}\.[0-9]+$" | sort -V | tail -1)
            if [ "$newest" = "$VERSION" ]; then
              tags+=(--tag "$IMAGE:$minor")
            else
              echo "::notice::v$newest is newer than v$VERSION; leaving :$minor alone."
            fi
          fi
          docker buildx imagetools create "${tags[@]}" "$IMAGE@$digest"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists."
            exit 0
          fi
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" "${prerelease[@]}"
